name: Build Mobile App

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

# Default to read-only; the release job overrides to write for contents.
permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradle wrapper executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbitui-android
          retention-days: 7
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  build-ios-simulator:
    name: Build iOS (simulator)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.3"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Generate native iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build iOS app (simulator)
        working-directory: mobile
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: no .xcworkspace found after expo prebuild" >&2
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ./build/ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS simulator app
        run: |
          APP_PATH=$(find mobile/build/ios -name "*.app" | grep -v "\.xctest" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: no .app bundle found after xcodebuild" >&2
            exit 1
          fi
          zip -r mobile/build/qbitui-ios-simulator.zip "$APP_PATH"

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbitui-ios-simulator
          retention-days: 7
          path: mobile/build/qbitui-ios-simulator.zip
          if-no-files-found: warn

  build-ios-device:
    name: Build iOS (real device IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.3"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Generate native iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build iOS app (device)
        working-directory: mobile
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: no .xcworkspace found after expo prebuild" >&2
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build/ios-device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            VALID_ARCHS="arm64" \
            build

      - name: Package iOS device IPA (Payload trick)
        run: |
          APP_PATH=$(find mobile/build/ios-device -name "*.app" | grep -v "\.xctest" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: no .app bundle found after xcodebuild" >&2
            exit 1
          fi
          mkdir -p mobile/build/ipa/Payload
          cp -r "$APP_PATH" mobile/build/ipa/Payload/
          cd mobile/build/ipa
          zip -r qbitui-ios-device.ipa Payload
          mv qbitui-ios-device.ipa ../

      - name: Upload iOS device artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbitui-ios-device
          retention-days: 7
          path: mobile/build/qbitui-ios-device.ipa
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [build-android, build-ios-simulator, build-ios-device]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.apk
            artifacts/**/*.zip
            artifacts/**/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
