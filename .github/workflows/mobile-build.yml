name: Build Mobile App

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default read-only; release job upgrades to write for contents.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Android – APK (debug) + AAB (release)
  # ─────────────────────────────────────────────
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Install workspace root deps (hoists @qbitui/core)
      - name: Install root dependencies
        run: npm ci

      # Install mobile-specific deps separately (React 18 vs 19 conflict)
      - name: Install mobile dependencies
        working-directory: packages/mobile
        run: npm install

      - name: Generate native Android project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --no-install --clean

      # ── Optional release signing ──────────────────────────────────────
      # Set these secrets in Settings → Secrets → Actions to enable signed
      # release builds:
      #   ANDROID_KEYSTORE_BASE64  – base64 of your .jks / .keystore file
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      # Without these secrets only the debug APK is produced.
      - name: Configure release signing (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > packages/mobile/android/app/release.keystore
          cat >> packages/mobile/android/gradle.properties <<EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build debug APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: packages/mobile/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qbitui-android
          retention-days: 7
          path: |
            packages/mobile/android/app/build/outputs/apk/**/*.apk
            packages/mobile/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # iOS – IPA
  # ─────────────────────────────────────────────
  ios:
    name: iOS (IPA)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install workspace root deps (hoists @qbitui/core)
      - name: Install root dependencies
        run: npm ci

      # Install mobile-specific deps separately (React 18 vs 19 conflict)
      - name: Install mobile dependencies
        working-directory: packages/mobile
        run: npm install

      - name: Generate native iOS project
        working-directory: packages/mobile
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        working-directory: packages/mobile/ios
        run: pod install

      # ── Optional distribution signing ────────────────────────────────
      # Set these secrets to enable properly signed IPA for distribution:
      #   IOS_CERTIFICATE_BASE64       – base64 of .p12 distribution cert
      #   IOS_CERTIFICATE_PASSWORD     – .p12 password
      #   IOS_PROVISIONING_PROFILE_BASE64 – base64 of .mobileprovision
      #   IOS_TEAM_ID                  – Apple Developer Team ID
      # Without these secrets an ad-hoc unsigned IPA is produced instead.
      - name: Install signing certificate
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        if: ${{ env.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$PROFILE_PATH/qbitui.mobileprovision"

      # Build unsigned archive when no signing secrets are provided
      - name: Build iOS archive (unsigned)
        if: ${{ env.IOS_CERTIFICATE_BASE64 == '' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        working-directory: packages/mobile/ios
        run: |
          xcodebuild \
            -workspace qbitui.xcworkspace \
            -scheme qbitui \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/qbitui.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive | xcpretty || true
          # Package the unsigned .app as an IPA
          APP_PATH=$(find "$RUNNER_TEMP/qbitui.xcarchive" -name "*.app" | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r qbitui-unsigned.ipa Payload/

      # Build signed archive when certificate secrets are provided
      - name: Build iOS archive (signed)
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        working-directory: packages/mobile/ios
        run: |
          xcodebuild \
            -workspace qbitui.xcworkspace \
            -scheme qbitui \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/qbitui.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            archive | xcpretty

      - name: Export signed IPA
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/qbitui.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa-export" | xcpretty

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbitui-ios
          retention-days: 7
          path: |
            ${{ runner.temp }}/qbitui-unsigned.ipa
            ${{ runner.temp }}/ipa-export/*.ipa
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # GitHub Release – attach mobile artifacts
  # ─────────────────────────────────────────────
  release-mobile:
    name: Publish Mobile Artifacts
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download all mobile artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: mobile-artifacts
          pattern: qbitui-android
          merge-multiple: true

      - name: Download iOS artifact
        uses: actions/download-artifact@v4.1.3
        with:
          path: mobile-artifacts
          pattern: qbitui-ios
          merge-multiple: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile-artifacts/**/*.apk
            mobile-artifacts/**/*.aab
            mobile-artifacts/**/*.ipa
          generate_release_notes: false
