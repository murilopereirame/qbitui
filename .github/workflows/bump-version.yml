name: Bump App Version

# Bumps the app version across the Electron and mobile apps, keeping
# root package.json, mobile/package.json and mobile/app.json in sync.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver part to increment (ignored when 'version' is set)"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit version to set (e.g. 1.4.1). Overrides 'bump'."
        type: string
        required: false

permissions:
  contents: write

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          echo "Current version: $current"

          if [ -n "${{ inputs.version }}" ]; then
            next="${{ inputs.version }}"
          else
            IFS='.' read -r major minor patch <<< "$current"
            case "${{ inputs.bump }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            next="$major.$minor.$patch"
          fi

          if ! [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: '$next' is not a valid semver version" >&2
            exit 1
          fi

          echo "Next version: $next"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Apply version to all manifests
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const next = process.env.NEXT;
            const setJson = (file, apply) => {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              apply(json);
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
              console.log(`Updated ${file} -> ${next}`);
            };
            setJson("package.json", (j) => { j.version = next; });
            setJson("mobile/package.json", (j) => { j.version = next; });
            setJson("mobile/app.json", (j) => { j.expo.version = next; });
          '

      - name: Commit and push
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No version changes to commit (already at $NEXT)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json mobile/package.json mobile/app.json
          git commit -m "chore: bump app version to v$NEXT"
          git push
